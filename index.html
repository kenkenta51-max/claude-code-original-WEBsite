<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Original Website Collection</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--paper:#FFFDF8;--ink:#7A4A2E;--grid:#DCE4EC;--pink:#F7C3CF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;line-height:1.8;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px;
  padding:56px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
main{max-width:880px;margin:0 auto;display:grid;gap:28px}
h1{font-family:Yomogi,sans-serif;font-weight:400;font-size:clamp(1.8rem,1.3rem + 2vw,2.8rem);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:20px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:3px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  padding:22px 24px;box-shadow:5px 6px 0 var(--ink);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
a.card:hover,a.card:focus-visible{transform:translateY(-6px) rotate(-1deg)}
a.card b{font-family:Yomogi,sans-serif;font-weight:400;font-size:1.5rem;display:block}
a.card small{letter-spacing:.16em;font-size:.72rem}
a.card p{margin:8px 0 0;font-size:.9rem}
.tag{display:inline-block;background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:.72rem;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Original Website Collection</h1>
  <div class="grid">
    <a class="card" href="marumasu-town/">
      <small>MARUMASU TOWN</small><b>まるます町</b>
      <p>お絵かきから飛び出した小さな遊びの街。3Dミニチュアタウン、住人図鑑、きせかえ、写真・らくがき、ミニゲーム2種で遊べる文房具ブランドのティザーサイト。</p>
      <span class="tag">Three.js / GSAP / 1ファイル</span>
    </a>
  </div>
</main>
</body>
</html>
